function buildAllTimeStats(seasonKeysFilter) {
  // one row per unique player, summed across every season they've appeared in (within the given season keys)
  const keys = seasonKeysFilter || SEASON_KEYS;
  const byPlayer = {};
  // fields beyond the always-tracked core that use "N/A until real data exists" semantics
  const naAwareFields = [
    ["nom", 6], ["repNom", 7], ["toWin", 11], ["toLose", 12], ["playedInHoh", 13],
    ["savedWithPov", 14], ["savedByOthersPov", 15], ["survivedNomAfterVeto", 16],
    ["survivedBackdoor", 17], ["hohAvoidedBlock", 18], ["votesAgainst", 19], ["votesFor", 20],
  ];
  for (const sk of keys) {
    const season = SEASONS[sk];
    for (const row of season.totalStats) {
      const [name, rowSeason, score, placement, hoh, pov] = row;
      const baseName = name; // the fixed identifier is already unique per real person — never strip it
      if (!byPlayer[baseName]) {
        byPlayer[baseName] = {
          player: name, rookieSeason: sk, seasons: [], placements: [], totalScore: 0, hoh: 0, pov: 0,
          evict: 0, save: 0, walked: 0, timesPlayed: 0, wins: 0,
        };
        for (const [key] of naAwareFields) {
          byPlayer[baseName][key] = 0;
          byPlayer[baseName]["has_" + key] = false;
        }
      }
      const p = byPlayer[baseName];
      p.seasons.push(sk);
      p.placements.push(placement);
      p.totalScore += score;
      p.hoh += hoh;
      p.pov += pov;
      p.evict += (row[8] === na ? 0 : row[8]);
      p.save += (row[9] === na ? 0 : row[9]);
      p.walked += (row[10] === na ? 0 : row[10]);
      for (const [key, idx] of naAwareFields) {
        if (row[idx] !== na) { p[key] += row[idx]; p["has_" + key] = true; }
      }
      p.timesPlayed += 1;
      p.wins += row[row.length - 1] === 1 ? 1 : 0;
    }
  }
  const players = Object.values(byPlayer);
  players.forEach((p) => {
    p.seasonsList = p.seasons.join(", ");
    p.placementsList = p.placements.join(", ");
    p.bestPlacement = Math.min(...p.placements.map(placementNum));
    for (const [key] of naAwareFields) {
      if (!p["has_" + key]) p[key] = na;
    }
  });
  return players;
}

function buildPerGameBreakdown(seasonKeysFilter) {
  const keys = seasonKeysFilter || SEASON_KEYS;
  const rows = [];
  for (const sk of keys) {
    SEASONS[sk].totalStats.forEach((row) => rows.push(row));
  }
  return rows;
}

// Builds a lookup: given any single season's Skill Rating (Score), returns its
// percentile against EVERY individual game ever played (every row in Per Game
// Breakdown — every player's every season, not aggregated). Used for the player
// card's season-by-season WAR trend chart.
function buildGameScorePercentileFn(perGame) {
  const scores = perGame.map((r) => r[2]).filter((s) => typeof s === "number").sort((a, b) => a - b);
  const n = scores.length;
  return (score) => {
    if (n === 0 || typeof score !== "number") return null;
    let lo = 0, hi = n;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (scores[mid] < score) lo = mid + 1; else hi = mid;
    }
    return n > 1 ? Math.round((lo / (n - 1)) * 1000) / 10 : 100;
  };
}

// Generic version of the above — same lookup, but takes any per-row scoring function
// instead of the hardcoded Score column. Used for the Comps/Nominations trend chart.
function buildRowScorePercentileFn(perGame, scoreFn) {
  const scores = perGame.map(scoreFn).filter((s) => typeof s === "number").sort((a, b) => a - b);
  const n = scores.length;
  return (row) => {
    const score = scoreFn(row);
    if (n === 0 || typeof score !== "number") return null;
    let lo = 0, hi = n;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (scores[mid] < score) lo = mid + 1; else hi = mid;
    }
    return n > 1 ? Math.round((lo / (n - 1)) * 1000) / 10 : 100;
  };
}

// Per-season (not all-time) Comp Ability, straight off a single Per Game Breakdown row:
// (HoH Wins x 10) + (PoV Wins x 5) - (Played in HoH x 2).
function rowCompScore(row) {
  const hoh = row[4] || 0;
  const pov = row[5] || 0;
  const playedInHoh = row[13] === na ? 0 : (row[13] || 0);
  return hoh * 10 + pov * 5 - playedInHoh * 2;
}

// Per-season (not all-time) Overall Nominations, same formula as the all-time version
// but read straight off a single row. N/A whenever that season never tracked Nom.
function rowOverallNomScore(row) {
  const nom = row[6];
  if (nom === na) return na;
  const repNom = row[7] === na ? 0 : row[7];
  const hohAvoidedBlock = row[18] === na ? 0 : row[18];
  const survivedNomAfterVeto = row[16] === na ? 0 : row[16];
  const survivedBackdoor = row[17] === na ? 0 : row[17];
  return (nom * -10) - (repNom * 5) + (hohAvoidedBlock * 5) + (survivedNomAfterVeto * 2) + (survivedBackdoor * 3);
}

// Season Difficulty: for each season, sum the ALL-TIME career skill rating (Total Score)
// of every player in that season's roster. A season stacked with accomplished vets scores
// higher than a season of untested rookies, regardless of how that particular season went.
function buildSeasonDifficulty(allTimeList) {
  const scoreByPlayer = new Map(allTimeList.map((p) => [p.player, p.totalScore]));
  return SEASON_KEYS.map((sk) => {
    const season = SEASONS[sk];
    const players = season.totalStats.length;
    const difficulty = season.totalStats.reduce((sum, row) => sum + (scoreByPlayer.get(row[0]) || 0), 0);
    return [sk, eraForSeason(sk).name, players, difficulty];
  });
}

// Skill Rating percentile — returnees only (Times Played >= 2), ranked by their
// ALL-TIME Total Score. Highest score = 100th percentile. Returns a Map keyed by
// the player's fixed identifier -> percentile (0-100), only for returnees.
// Generic returnee percentile ranker — takes a scoring function, ranks returnees
// (Times Played >= 2) by that score, highest = 100th percentile.
function buildReturneePercentiles(allTimeList, scoreFn) {
  const returnees = allTimeList.filter((p) => p.timesPlayed >= 2);
  const scored = returnees
    .map((p) => ({ player: p.player, score: scoreFn(p) }))
    .filter((p) => p.score !== na); // players whose formula resolves to N/A get no bar at all
  const sorted = [...scored].sort((a, b) => b.score - a.score);
  const n = sorted.length;
  const map = new Map();
  sorted.forEach((p, idx) => {
    const percentile = n > 1 ? ((n - 1 - idx) / (n - 1)) * 100 : 100;
    map.set(p.player, Math.round(percentile * 100) / 100);
  });
  return map;
}

function buildSkillRatingPercentiles(allTimeList) {
  return buildReturneePercentiles(allTimeList, skillScore);
}
function skillScore(p) { return p.totalScore; }

// Comp Rating = (HoH Wins × 10) + (PoV Wins × 5) - (Played in HoH × 2), all-time totals.
function compScore(p) {
  const hoh = p.hoh || 0;
  const pov = p.pov || 0;
  const playedInHoh = p.playedInHoh === na ? 0 : (p.playedInHoh || 0);
  return hoh * 10 + pov * 5 - playedInHoh * 2;
}
function buildCompRatingPercentiles(allTimeList) {
  return buildReturneePercentiles(allTimeList, compScore);
}

// HoH Rating = (HoH Wins × 10) - (Played in HoH × 2), all-time totals.
function hohScore(p) {
  const hoh = p.hoh || 0;
  const playedInHoh = p.playedInHoh === na ? 0 : (p.playedInHoh || 0);
  return hoh * 10 - playedInHoh * 2;
}
function buildHohRatingPercentiles(allTimeList) {
  return buildReturneePercentiles(allTimeList, hohScore);
}

// PoV Rating: if Nom was never tracked for this player, (PoV Wins × 15) - (Played in HoH × 5).
// Otherwise (PoV Wins × 15) - (Nom × 2) + (Rep Nom × 2) - (Played in HoH × 2).
function povScore(p) {
  const pov = p.pov || 0;
  const playedInHoh = p.playedInHoh === na ? 0 : (p.playedInHoh || 0);
  if (p.nom === na) {
    return pov * 15 - playedInHoh * 5;
  }
  const nom = p.nom || 0;
  const repNom = p.repNom === na ? 0 : (p.repNom || 0);
  return pov * 15 - nom * 2 + repNom * 2 - playedInHoh * 2;
}
function buildPovRatingPercentiles(allTimeList) {
  return buildReturneePercentiles(allTimeList, povScore);
}

/* ---- SOCIAL GAME ---- */

// Overall Nominations = -10×Nom - 5×RepNom + 5×HoH's-avoided-block + 2×SurvivedNomAfterVeto + 3×SurvivedBackdoor
// N/A whenever Nom itself was never tracked for this player.
function overallNomScore(p) {
  if (p.nom === na) return na;
  const repNom = p.repNom === na ? 0 : p.repNom;
  const hohAvoidedBlock = p.hohAvoidedBlock === na ? 0 : p.hohAvoidedBlock;
  const survivedNomAfterVeto = p.survivedNomAfterVeto === na ? 0 : p.survivedNomAfterVeto;
  const survivedBackdoor = p.survivedBackdoor === na ? 0 : p.survivedBackdoor;
  return (p.nom * -10) - (repNom * 5) + (hohAvoidedBlock * 5) + (survivedNomAfterVeto * 2) + (survivedBackdoor * 3);
}
function buildOverallNominationsPercentiles(allTimeList) {
  return buildReturneePercentiles(allTimeList, overallNomScore);
}

// Times Nominated = (PlayedInHoH - Nom) / TimesPlayed. 0 whenever Nom was never tracked.
function timesNominatedScore(p) {
  if (p.nom === na) return 0;
  const playedInHoh = p.playedInHoh === na ? 0 : p.playedInHoh;
  return (playedInHoh - p.nom) / p.timesPlayed;
}
function buildTimesNominatedPercentiles(allTimeList) {
  return buildReturneePercentiles(allTimeList, timesNominatedScore);
}

// Replacement Nominated: -3 if RepNom never tracked; Nom (or 0) if RepNom is exactly 0;
// otherwise 1 - (RepNom / TimesPlayed).
function repNominatedScore(p) {
  if (p.repNom === na) return -3;
  if (p.repNom === 0) return p.nom === na ? 0 : p.nom;
  return 1 - (p.repNom / p.timesPlayed);
}
function buildReplacementNominatedPercentiles(allTimeList) {
  return buildReturneePercentiles(allTimeList, repNominatedScore);
}

// Saved with PoV = (SavedWithPoV × 10) - (Nom × 5). -1000 whenever Nom was never tracked.
function savedWithPovScore(p) {
  if (p.nom === na) return -1000;
  const savedWithPov = p.savedWithPov === na ? 0 : p.savedWithPov;
  return (savedWithPov * 10) - (p.nom * 5);
}
function buildSavedWithPovPercentiles(allTimeList) {
  return buildReturneePercentiles(allTimeList, savedWithPovScore);
}

// Votes to Save: if SurvivedNomAfterVeto never tracked, (VotesFor / TimesPlayed) × 2;
// otherwise VotesFor - (SurvivedNomAfterVeto × 2).
function votesToSaveScore(p) {
  const votesFor = p.votesFor === na ? 0 : p.votesFor;
  if (p.survivedNomAfterVeto === na) return (votesFor / p.timesPlayed) * 2;
  return votesFor - (p.survivedNomAfterVeto * 2);
}
function buildVotesToSavePercentiles(allTimeList) {
  return buildReturneePercentiles(allTimeList, votesToSaveScore);
}

/* ---- STRATEGICAL GAME ---- */

// Votes Survived = (SurvivedNomAfterVeto × 4) + (PlayedInHoH × 0.25). -1000 whenever
// SurvivedNomAfterVeto was never tracked.
function votesSurvivedScore(p) {
  if (p.survivedNomAfterVeto === na) return -1000;
  const playedInHoh = p.playedInHoh === na ? 0 : p.playedInHoh;
  return (p.survivedNomAfterVeto * 4) + (playedInHoh * 0.25);
}
function buildVotesSurvivedPercentiles(allTimeList) {
  return buildReturneePercentiles(allTimeList, votesSurvivedScore);
}

// Survived Backdoor = (SurvivedBackdoor × 8) + (PlayedInHoH / 5). -1000 whenever
// SurvivedNomAfterVeto was never tracked.
function survivedBackdoorScore(p) {
  if (p.survivedNomAfterVeto === na) return -1000;
  const survivedBackdoor = p.survivedBackdoor === na ? 0 : p.survivedBackdoor;
  const playedInHoh = p.playedInHoh === na ? 0 : p.playedInHoh;
  return (survivedBackdoor * 8) + (playedInHoh / 5);
}
function buildSurvivedBackdoorPercentiles(allTimeList) {
  return buildReturneePercentiles(allTimeList, survivedBackdoorScore);
}

// Votes to evict: if SurvivedNomAfterVeto never tracked, (VotesAgainst / TimesPlayed) × 2;
// otherwise VotesAgainst - (SurvivedNomAfterVeto × 2). Whole result is then negated.
function votesToEvictScore(p) {
  const votesAgainst = p.votesAgainst === na ? 0 : p.votesAgainst;
  const base = p.survivedNomAfterVeto === na
    ? (votesAgainst / p.timesPlayed) * 2
    : votesAgainst - (p.survivedNomAfterVeto * 2);
  return base * -1;
}
function buildVotesToEvictPercentiles(allTimeList) {
  return buildReturneePercentiles(allTimeList, votesToEvictScore);
}

// Jury Management = (ToWin × 2) - ToLose. N/A whenever ToWin was never tracked.
function juryManagementScore(p) {
  if (p.toWin === na) return na;
  const toLose = p.toLose === na ? 0 : p.toLose;
  return (p.toWin * 2) - toLose;
}
function buildJuryManagementPercentiles(allTimeList) {
  return buildReturneePercentiles(allTimeList, juryManagementScore);
}

// Quality of Competition: for each returnee, average the Season Difficulty score
// (sum of every roster member's all-time Total Score) across every season they played,
// then percentile that average against other returnees.
function buildQualityOfCompetitionPercentiles(allTimeList) {
  const difficultyRows = buildSeasonDifficulty(allTimeList);
  const difficultyBySeason = new Map(difficultyRows.map((r) => [r[0], r[3]]));
  return buildReturneePercentiles(allTimeList, (p) => {
    const total = p.seasons.reduce((sum, sk) => sum + (difficultyBySeason.get(sk) || 0), 0);
    return total / p.timesPlayed;
  });
}

/* ---------------------------------------------------------
   PLAYER CARD PERCENTILES — includes one-time players too
--------------------------------------------------------- */
// Every percentile above is returnee-only (Times Played >= 2), used by Assessment,
// Comparisons, and Simulation. Player CARDS are different: a one-time player should
// still get percentile bars, but their single season isn't directly comparable to a
// returnee's multi-season cumulative totals. So for card display only, a one-timer's
// underlying stats get scaled by a Quality-of-Competition multiplier — based on how
// tough their one season was relative to every other season on record — before being
// folded into the SAME ranking pool as every returnee. WAR and Quality of Competition
// itself are never scaled (WAR stays a raw, direct comparison; QoC IS the season-toughness
// measure, so adjusting it by itself would double-count).

// Percentile (0-100) of each season's own difficulty score, ranked against every season.
function buildSeasonDifficultyPercentiles(allTimeList) {
  const diffRows = buildSeasonDifficulty(allTimeList); // [sk, eraName, players, difficulty]
  const sorted = [...diffRows].sort((a, b) => a[3] - b[3]); // ascending
  const n = sorted.length;
  const map = new Map();
  sorted.forEach((row, idx) => {
    const pct = n > 1 ? (idx / (n - 1)) * 100 : 100;
    map.set(row[0], pct);
  });
  return map;
}

// Linear 0.5x (easiest season on record) to 0.8x (hardest) — never a bonus, always at
// least some discount for having faced an easier field.
function qocMultiplier(seasonDifficultyPct) {
  return 0.5 + 0.3 * (seasonDifficultyPct / 100);
}

// Applies the multiplier to a player's FINAL score, sign-aware: a positive score gets
// discounted toward zero (weaker credit for an easy field), but a negative score gets
// pushed further AWAY from zero (a bad season against weak competition is worse, not
// forgiven) — using the reciprocal of the same multiplier. Both directions agree at
// 1.0x (hardest season, no adjustment either way).
function applyQocToScore(score, mult) {
  if (score === na) return na;
  return score >= 0 ? score * mult : score / mult;
}

// One-time players only get folded into card percentiles at all if their rookie (and
// only) season was a top-6 placement — a one-and-done 10th place finish is too thin a
// sample to rank fairly against anyone, adjusted or not.
function oneTimerEligibleForCard(p) {
  return p.timesPlayed !== 1 || (p.bestPlacement != null && p.bestPlacement <= 6);
}

// Generic card-percentile ranker: includes every returnee, plus one-time players who
// placed top 6 (their final score QoC-adjusted when applyQoc is true), ranked together
// in a single pool.
function buildCardPercentiles(allTimeList, scoreFn, seasonDifficultyPercentiles, applyQoc) {
  const eligible = allTimeList.filter(oneTimerEligibleForCard);
  const scored = eligible.map((p) => {
    let score = scoreFn(p);
    if (applyQoc && p.timesPlayed === 1 && score !== na) {
      const sk = p.seasons[0];
      const diffPct = seasonDifficultyPercentiles.has(sk) ? seasonDifficultyPercentiles.get(sk) : 50;
      score = applyQocToScore(score, qocMultiplier(diffPct));
    }
    return { player: p.player, score };
  }).filter((s) => s.score !== na);
  const sorted = [...scored].sort((a, b) => b.score - a.score);
  const n = sorted.length;
  const map = new Map();
  sorted.forEach((s, idx) => {
    const pct = n > 1 ? ((n - 1 - idx) / (n - 1)) * 100 : 100;
    map.set(s.player, Math.round(pct * 100) / 100);
  });
  return map;
}

function buildSkillRatingCardPercentiles(allTimeList) {
  return buildCardPercentiles(allTimeList, skillScore, null, false);
}
function buildCompRatingCardPercentiles(allTimeList, sdp) {
  return buildCardPercentiles(allTimeList, compScore, sdp, true);
}
function buildHohRatingCardPercentiles(allTimeList, sdp) {
  return buildCardPercentiles(allTimeList, hohScore, sdp, true);
}
function buildPovRatingCardPercentiles(allTimeList, sdp) {
  return buildCardPercentiles(allTimeList, povScore, sdp, true);
}
function buildOverallNominationsCardPercentiles(allTimeList, sdp) {
  return buildCardPercentiles(allTimeList, overallNomScore, sdp, true);
}
function buildTimesNominatedCardPercentiles(allTimeList, sdp) {
  return buildCardPercentiles(allTimeList, timesNominatedScore, sdp, true);
}
function buildReplacementNominatedCardPercentiles(allTimeList, sdp) {
  return buildCardPercentiles(allTimeList, repNominatedScore, sdp, true);
}
function buildSavedWithPovCardPercentiles(allTimeList, sdp) {
  return buildCardPercentiles(allTimeList, savedWithPovScore, sdp, true);
}
function buildVotesToSaveCardPercentiles(allTimeList, sdp) {
  return buildCardPercentiles(allTimeList, votesToSaveScore, sdp, true);
}
function buildVotesSurvivedCardPercentiles(allTimeList, sdp) {
  return buildCardPercentiles(allTimeList, votesSurvivedScore, sdp, true);
}
function buildSurvivedBackdoorCardPercentiles(allTimeList, sdp) {
  return buildCardPercentiles(allTimeList, survivedBackdoorScore, sdp, true);
}
function buildVotesToEvictCardPercentiles(allTimeList, sdp) {
  return buildCardPercentiles(allTimeList, votesToEvictScore, sdp, true);
}
function buildJuryManagementCardPercentiles(allTimeList, sdp) {
  return buildCardPercentiles(allTimeList, juryManagementScore, sdp, true);
}
function buildQualityOfCompetitionCardPercentiles(allTimeList) {
  const difficultyRows = buildSeasonDifficulty(allTimeList);
  const difficultyBySeason = new Map(difficultyRows.map((r) => [r[0], r[3]]));
  return buildCardPercentiles(allTimeList, (p) => {
    const total = p.seasons.reduce((sum, sk) => sum + (difficultyBySeason.get(sk) || 0), 0);
    return total / p.timesPlayed;
  }, null, false);
}

/* ---------------------------------------------------------
/* ---------------------------------------------------------
   HOME SCREEN DATA
--------------------------------------------------------- */
// A player's card image always shows their LATEST season played, matching
// how the player modal picks its photo.
function playerImage(p) {
  const latest = p.seasons[p.seasons.length - 1];
  return (SEASON_IMAGES[p.player] && SEASON_IMAGES[p.player][latest]) || null;
}

// Walks seasons newest-to-oldest looking at each season's actual winner (Win === 1 in
// that season's Total Stats row). The stored "Winner" column on each row is just a
// literal per-season copy of Win (0 or 1) — not a running career total — so instead we
// first build each player's own list of win-seasons (ascending) from the reliable Win
// flag, then use a win's position in that list as its true career rank (1st title,
// 2nd title, etc.) when scanning backwards for the most recent of each kind.
// Rookie winner: first title AND it happened in their debut (rookie) season.
// Vet winner: won a season that's flagged as strictly-veterans (season.vetSeason) — this
// is about the SEASON's type, not the player's own win count, so a multi-time champion
// still counts here if the season itself was a vet season.
// Multi-time winner: not their first title (2nd+ career win as of this season).
function findRecentWinners(allTimeList) {
  const byPlayer = new Map(allTimeList.map((p) => [p.player, p]));

  const winSeasonsByPlayer = new Map();
  for (const sk of SEASON_KEYS) {
    const winnerRow = SEASONS[sk].totalStats.find((row) => row[22] === 1);
    if (!winnerRow) continue;
    const name = winnerRow[0];
    if (!winSeasonsByPlayer.has(name)) winSeasonsByPlayer.set(name, []);
    winSeasonsByPlayer.get(name).push(sk);
  }

  let recentRookie = null, recentVet = null, recentMulti = null;
  for (let i = SEASON_KEYS.length - 1; i >= 0; i--) {
    const sk = SEASON_KEYS[i];
    const winnerRow = SEASONS[sk].totalStats.find((row) => row[22] === 1);
    if (!winnerRow) continue;
    const name = winnerRow[0];
    const p = byPlayer.get(name);
    if (!p) continue;
    const allWinSeasons = winSeasonsByPlayer.get(name);
    const winRank = allWinSeasons.indexOf(sk) + 1; // 1st title, 2nd title, ...
    const isDebutSeason = p.rookieSeason === sk;
    if (!recentRookie && winRank === 1 && isDebutSeason) recentRookie = { season: sk, allWinSeasons, player: p };
    if (!recentVet && SEASONS[sk].vetSeason === true) recentVet = { season: sk, allWinSeasons, player: p };
    if (!recentMulti && winRank >= 2) recentMulti = { season: sk, allWinSeasons, player: p };
    if (recentRookie && recentVet && recentMulti) break;
  }
  return { recentRookie, recentVet, recentMulti };
}

// Top N by Comp Ability percentile (Physical Game's returnee-only ranking) — same pool
// and same numbers shown on each player's own card, just sorted down to the top N.
function buildTopCompPlayers(allTimeList, compPercentiles, n) {
  return allTimeList
    .filter((p) => compPercentiles.has(p.player))
    .map((p) => ({ player: p, score: compPercentiles.get(p.player) }))
    .sort((a, b) => b.score - a.score)
    .slice(0, n);
}

// Top N by WAR (Skill Rating) percentile — same returnee-only ranking used on player cards.
function buildTopWarPlayers(allTimeList, skillPercentiles, n) {
  return allTimeList
    .filter((p) => skillPercentiles.has(p.player))
    .map((p) => ({ player: p, score: skillPercentiles.get(p.player) }))
    .sort((a, b) => b.score - a.score)
    .slice(0, n);
}

// Top N hardest seasons, reusing the same Season Difficulty calculation as its own tab.
// (Left as a raw difficulty score, not a percentile — seasons aren't ranked that way elsewhere.)
function buildTopHardestSeasons(allTimeList, n) {
  return [...buildSeasonDifficulty(allTimeList)].sort((a, b) => b[3] - a[3]).slice(0, n);
}

// Every "Winners at War" themed season (matched by label, not a hardcoded season list —
// so a future WaW-titled season picks this up automatically) and who won each one.
function buildWinnersAtWarWinners(allTimeList) {
  const byPlayer = new Map(allTimeList.map((p) => [p.player, p]));
  return SEASON_KEYS
    .filter((sk) => SEASONS[sk].label.includes("Winners at War"))
    .map((sk) => {
      const winnerRow = SEASONS[sk].totalStats.find((row) => row[22] === 1);
      const player = winnerRow ? byPlayer.get(winnerRow[0]) : null;
      return { seasonKey: sk, label: SEASONS[sk].label, player };
    });
}

// Every player who has won 2+ seasons, not just the most recent one — ranked by win
// count first, then by how recently their latest win was.
function buildAllMultiTimeWinners(allTimeList) {
  const byPlayer = new Map(allTimeList.map((p) => [p.player, p]));
  const winSeasonsByPlayer = new Map();
  for (const sk of SEASON_KEYS) {
    const winnerRow = SEASONS[sk].totalStats.find((row) => row[22] === 1);
    if (!winnerRow) continue;
    const name = winnerRow[0];
    if (!winSeasonsByPlayer.has(name)) winSeasonsByPlayer.set(name, []);
    winSeasonsByPlayer.get(name).push(sk);
  }
  const multi = [];
  for (const [name, seasons] of winSeasonsByPlayer) {
    if (seasons.length < 2) continue;
    const player = byPlayer.get(name);
    if (!player) continue;
    multi.push({ player, wins: seasons.length, seasons: [...seasons].sort((a, b) => a - b) });
  }
  multi.sort((a, b) => b.wins - a.wins || Math.max(...b.seasons) - Math.max(...a.seasons));
  return multi;
}

// Top N players by WAR percentile among everyone who has never won a season.
function buildBestNonWinners(allTimeList, skillPercentiles, n) {
  return allTimeList
    .filter((p) => p.wins === 0 && skillPercentiles && skillPercentiles.has(p.player))
    .map((p) => ({ player: p, score: skillPercentiles.get(p.player) }))
    .sort((a, b) => b.score - a.score)
    .slice(0, n);
}


// this season (inclusive) — distinct from "Win", the literal did-they-win-THIS-season flag.
// Grows every time they win, never resets. Rows must already be in ascending season
// order (buildPerGameBreakdown guarantees this).
function withCumulativeWinnerCount(rows) {
  const winCounts = new Map();
  return rows.map((row) => {
    if (row[22] === 1) winCounts.set(row[0], (winCounts.get(row[0]) || 0) + 1);
    const newRow = [...row];
    newRow[23] = winCounts.get(row[0]) || 0;
    return newRow;
  });
}

/* ---------------------------------------------------------
   UI PRIMITIVES
--------------------------------------------------------- */
// Handles both plain numeric placements and tie labels like "2 / 3" (takes the first number).
function placementNum(v) {
  if (typeof v === "number") return v;
  const m = String(v).match(/\d+/);
  return m ? parseInt(m[0], 10) : Infinity;
}

// Deterministic color for a player's fallback avatar, so untagged players get
// varied, pleasant colors instead of all looking identical.
const AVATAR_PALETTE = [
  ["#E8A33D", "#c47f1f"], // amber
  ["#8B7CF6", "#6a5acd"], // purple
  ["#33C2A4", "#1f9c82"], // teal
  ["#E4573D", "#c23f28"], // coral
  ["#4E9DE0", "#3170ad"], // blue
  ["#E062AE", "#b8408a"], // pink
  ["#6FBF73", "#4a9950"], // green
  ["#D4A94B", "#a9822f"], // gold
];
function avatarColors(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_PALETTE[hash % AVATAR_PALETTE.length];
}

// Red (0%) to blue (100%) interpolation for percentile bars.
function percentileColor(pct) {
  const t = Math.max(0, Math.min(100, pct)) / 100;
  const r = Math.round(228 + (59 - 228) * t);
  const g = Math.round(87 + (130 - 87) * t);
  const b = Math.round(61 + (246 - 61) * t);
  return `rgb(${r}, ${g}, ${b})`;
}

function PercentileBar({ label, pct }) {
  if (pct == null) return null;
  const color = percentileColor(pct);
  return (
    <div className="pctbar-row">
      <div className="pctbar-label-row">
        <span className="pctbar-label">{label}</span>
        <span className="pctbar-value" style={{ color }}>{pct}%</span>
      </div>
      <div className="pctbar-track">
        <div className="pctbar-fill" style={{ width: `${pct}%`, background: color }} />
      </div>
    </div>
  );
}

function compareValues(a, b) {
  const aNA = a === na, bNA = b === na;
  if (aNA && bNA) return 0;
  if (aNA) return 1;
  if (bNA) return -1;
  // Numeric strings (e.g. from .toFixed()) sort as numbers too, not lexically —
  // otherwise "13.9" sorts before "8.1" the same way "13" comes before "8" as text.
  const toNum = (v) => {
    if (typeof v === "number") return v;
    if (typeof v === "string" && v.trim() !== "" && !isNaN(v)) return Number(v);
    return null;
  };
  const aNum = toNum(a), bNum = toNum(b);
  if (aNum !== null && bNum !== null) return aNum - bNum;
  return String(a).localeCompare(String(b));
}

function DataTable({ columns, rows, highlightWinnerCol, highlightColIdx, sortable, defaultSortIdx, defaultSortAsc, filterable, onPlayerClick, imageLookup, imageColumn }) {
  const [sortIdx, setSortIdx] = useState(sortable ? (defaultSortIdx ?? 1) : null);
  const [sortAsc, setSortAsc] = useState(defaultSortAsc ?? false);
  const [filters, setFilters] = useState({}); // idx -> Set of selected values (absent = all selected)
  const [openFilter, setOpenFilter] = useState(null); // { idx, top, left }
  const [filterSearch, setFilterSearch] = useState("");
  const panelRef = useRef(null);

  useEffect(() => {
    if (!openFilter) return;
    function handleClickOutside(e) {
      if (panelRef.current && !panelRef.current.contains(e.target)) setOpenFilter(null);
    }
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, [openFilter]);

  function uniqueValuesFor(idx) {
    const vals = [...new Set(rows.map((r) => r[idx]))];
    vals.sort(compareValues);
    return vals;
  }

  const filteredRows = filterable
    ? rows.filter((row) => columns.every((c, idx) => !filters[idx] || filters[idx].has(row[idx])))
    : rows;

  const displayRows = sortable && sortIdx != null
    ? [...filteredRows].sort((a, b) => compareValues(a[sortIdx], b[sortIdx]) * (sortAsc ? 1 : -1))
    : filteredRows;

  function handleHeaderClick(idx) {
    if (!sortable) return;
    if (idx === sortIdx) setSortAsc(!sortAsc);
    else { setSortIdx(idx); setSortAsc(true); }
  }

  function openFilterFor(idx, e) {
    e.stopPropagation();
    const rect = e.currentTarget.getBoundingClientRect();
    setFilterSearch("");
    setOpenFilter((prev) => (prev && prev.idx === idx ? null : { idx, top: rect.bottom + 4, left: rect.left }));
  }

  function toggleValue(idx, val) {
    setFilters((prev) => {
      const allVals = uniqueValuesFor(idx);
      const current = prev[idx] ? new Set(prev[idx]) : new Set(allVals);
      if (current.has(val)) current.delete(val); else current.add(val);
      const next = { ...prev };
      if (current.size === allVals.length) delete next[idx];
      else next[idx] = current;
      return next;
    });
  }

  function selectAll(idx) {
    setFilters((prev) => { const next = { ...prev }; delete next[idx]; return next; });
  }
  function selectNone(idx) {
    setFilters((prev) => ({ ...prev, [idx]: new Set() }));
  }

  const hasActiveFilters = filterable && Object.keys(filters).length > 0;
  const openValues = openFilter ? uniqueValuesFor(openFilter.idx) : [];
  const openVisibleValues = openFilter
    ? openValues.filter((v) => (v === na ? "n/a" : String(v).toLowerCase()).includes(filterSearch.toLowerCase()))
    : [];

  return (
    <div className="table-scroll-x">
      {filterable && hasActiveFilters && (
        <div className="filter-summary">
          Showing {filteredRows.length} of {rows.length} rows
          <button className="clear-filters-btn" onClick={() => setFilters({})}>Clear filters</button>
        </div>
      )}
      <table>
        <thead>
          <tr>
            {sortable && <th className="rank-th">#</th>}
            {columns.map((c, idx) => (
              <React.Fragment key={c}>
                <th className={sortable ? `sortable-th ${sortIdx === idx ? "active-sort" : ""}` : ""}>
                  <span onClick={() => handleHeaderClick(idx)}>
                    {c}{sortable && sortIdx === idx ? (sortAsc ? " ▲" : " ▼") : ""}
                  </span>
                  {filterable && (
                    <button
                      className={`filter-icon-btn ${filters[idx] ? "filter-active" : ""}`}
                      onClick={(e) => openFilterFor(idx, e)}
                      aria-label={`Filter ${c}`}
                    >▾</button>
                  )}
                </th>
                {imageColumn && idx === 0 && <th className="img-th"></th>}
              </React.Fragment>
            ))}
          </tr>
        </thead>
        <tbody>
          {displayRows.map((row, i) => (
            <tr
              key={i}
              className={`${highlightWinnerCol && row[highlightColIdx ?? row.length - 1] >= 1 ? "winner-row" : ""} ${onPlayerClick ? "clickable-row" : ""}`}
              onClick={onPlayerClick ? () => onPlayerClick(row[0]) : undefined}
            >
              {sortable && <td className="rank-cell">{i + 1}</td>}
              {row.map((v, j) => (
                <React.Fragment key={j}>
                  <td className={j === 0 ? "name-cell" : columns[j] === "Seasons" ? "seasons-cell" : ""}>
                    {!imageColumn && j === 0 && imageLookup && imageLookup(row) && (
                      <img className="row-thumb" src={imageLookup(row)} alt="" />
                    )}
                    {v === na ? <span className="na">N/A</span> : v}
                  </td>
                  {imageColumn && j === 0 && (
                    <td className="img-cell">
                      {imageLookup && imageLookup(row) && <img className="season-thumb" src={imageLookup(row)} alt="" />}
                    </td>
                  )}
                </React.Fragment>
              ))}
            </tr>
          ))}
        </tbody>
      </table>

      {filterable && openFilter && (
        <div className="filter-panel" ref={panelRef} style={{ top: openFilter.top, left: openFilter.left }}>
          <input
            className="filter-search"
            placeholder="Search values"
            value={filterSearch}
            onChange={(e) => setFilterSearch(e.target.value)}
            autoFocus
          />
          <div className="filter-actions-row">
            <button onClick={() => selectAll(openFilter.idx)}>Select all</button>
            <button onClick={() => selectNone(openFilter.idx)}>Clear</button>
          </div>
          <div className="filter-value-list">
            {openVisibleValues.map((v, i) => {
              const isChecked = !filters[openFilter.idx] || filters[openFilter.idx].has(v);
              return (
                <label key={i} className="filter-value-row">
                  <input type="checkbox" checked={isChecked} onChange={() => toggleValue(openFilter.idx, v)} />
                  <span>{v === na ? "N/A" : String(v)}</span>
                </label>

            })}
            {openVisibleValues.length === 0 && <div className="filter-no-match">No matching values</div>}
          </div>
          <button className="filter-done-btn" onClick={() => setOpenFilter(null)}>Done</button>
        </div>
      )}

  );
}

// For compact-format seasons (no stored values.rows / skillCalc — everything derived from
// gameData + values.perUnit + values.placementTiers). Legacy seasons that still store
// values.rows / skillCalc directly (vet-multiplier seasons like S5/S10) bypass these.
function computeValuesRows(season) {
  if (season.values.rows) return season.values.rows;
  const { perUnit, placementTiers } = season.values;
  return placementTiers.map((tier) => [
    tier, perUnit.hoh, perUnit.pov, perUnit.nom, perUnit.repNom,
    perUnit.evict, perUnit.save, perUnit.walked, perUnit.toWin, perUnit.toLose,
  ]);
}

function computeSkillCalc(season) {
  if (season.skillCalc) return season.skillCalc;
  const { perUnit, placementTiers } = season.values;
  const bonus = season.bonus ?? 1000;
  return season.gameData.map((gd, idx) => {
    const [player, placement, hoh, pov, nom, repNom, evict, save, walked, toWin, toLose] = gd;
    const tier = placementTiers[idx];
    const hohVal = (hoh === na ? 0 : hoh) * perUnit.hoh;
    const povVal = (pov === na ? 0 : pov) * perUnit.pov;
    const nomVal = nom === na ? na : Math.round(-nom * perUnit.nom * 100) / 100;
    const repNomVal = repNom === na ? na : Math.round(-repNom * perUnit.repNom * 100) / 100;
    const evictVal = evict === na ? na : Math.round(-evict * perUnit.evict * 100) / 100;
    const saveVal = save === na ? na : Math.round(save * perUnit.save * 100) / 100;
    const walkedVal = walked === na ? na : Math.round(-walked * perUnit.walked * 100) / 100;
    const toWinVal = toWin === na ? na : Math.round(toWin * perUnit.toWin * 100) / 100;
    const toLoseVal = toLose === na ? na : Math.round(-toLose * perUnit.toLose * 100) / 100;
    let sum = tier + hohVal + povVal;
    [nomVal, repNomVal, evictVal, saveVal, walkedVal, toWinVal, toLoseVal].forEach((v) => { if (v !== na) sum += v; });
    sum = Math.round(sum * 100) / 100;
    let rating, adjustedSum;
    if (season.vetSeason) {
      adjustedSum = sum >= 0 ? Math.round(sum * season.multiplier * 100) / 100 : sum;
      rating = Math.round((adjustedSum + bonus) * 100) / 100;
    } else {
      rating = Math.round((sum + bonus) * 100) / 100;
    }
    return {
      player, placementTier: tier, hoh: hohVal, pov: povVal, nom: nomVal, repNom: repNomVal,
      evict: evictVal, save: saveVal, walked: walkedVal, toWin: toWinVal, toLose: toLoseVal,
      sum, adjustedSum, bonus, rating,
    };
  });
}

// Builds the display columns + rows for the "Skill Rating Calculation" table from any
// gameData/values pair — used directly for single-set seasons, and once per set for
// multi-set seasons (like Season 100's separate Bracket/Merge stages).
function buildSkillCalcDisplay(gameData, values, vetSeason, multiplier, bonus, skillCalcOverride) {
  const pseudoSeason = { gameData, values, vetSeason, multiplier, bonus, skillCalc: skillCalcOverride };
  const skillCalc = computeSkillCalc(pseudoSeason);
  const hasNom = gameData.some((row) => row[4] !== na);
  const nomCols = hasNom ? ["Nom", "Rep Nom"] : [];
  const bonusLabel = `+${bonus ?? 1000}`;
  const skillCols = vetSeason
    ? ["Player", "Placement Tier", "HoH", "PoV", ...nomCols, "Evict", "Save", "Walked", "To Win", "To Lose", "Sum", `×${multiplier} Applied`, "Adjusted Sum", bonusLabel, "Skill Rating"]
    : ["Player", "Placement Tier", "HoH", "PoV", ...nomCols, "Evict", "Save", "Walked", "To Win", "To Lose", "Sum", bonusLabel, "Skill Rating"];
  const skillRows = skillCalc.map((r) => {
    const nomVals = hasNom ? [r.nom, r.repNom] : [];
    return vetSeason
      ? [r.player, r.placementTier, r.hoh, r.pov, ...nomVals, r.evict, r.save, r.walked, r.toWin, r.toLose, r.sum, r.sum >= 0 ? "Yes" : "No", r.sum >= 0 ? r.adjustedSum : r.sum, r.bonus, r.rating]
      : [r.player, r.placementTier, r.hoh, r.pov, ...nomVals, r.evict, r.save, r.walked, r.toWin, r.toLose, r.sum, r.bonus, r.rating];
  });
  return { skillCols, skillRows };
}

/* ---------------------------------------------------------
   SEASON SIMULATION
--------------------------------------------------------- */
const SOCIAL_KEYS = ["overallNomPercentiles", "timesNominatedPercentiles", "repNominatedPercentiles", "savedWithPovPercentiles", "votesToSavePercentiles"];
const STRATEGY_KEYS = ["votesSurvivedPercentiles", "survivedBackdoorPercentiles", "votesToEvictPercentiles", "juryManagementPercentiles"];

// Default 15 (not a neutral 50) when a player has no percentile data for a stat —
// someone with nothing tracked shouldn't be treated as average in the simulation, since
// there's no evidence to support that; they get a low-but-not-zero floor instead.
function pctOrDefault(map, name, def = 15) {
  return map && map.has(name) ? map.get(name) : def;
}

function avgPercentileForGroups(name, mapKeys, percentileMaps, def = 15) {
  const vals = mapKeys.map((k) => (percentileMaps[k] && percentileMaps[k].has(name) ? percentileMaps[k].get(name) : null)).filter((v) => v != null);
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : def;
}

// "Best game" score for jury voting — a well-rounded measure of the whole season, not
// just one stat. Averages WAR, Overall Comp Ability, the Social Game group, and the
// Strategical Game group equally. Jury Management is only ONE of four stats folded into
// that last group, so it still counts but isn't a heavy factor on its own.
function bestGameScore(name, percentileMaps) {
  const war = pctOrDefault(percentileMaps.skillPercentiles, name);
  const physical = pctOrDefault(percentileMaps.compPercentiles, name);
  const social = avgPercentileForGroups(name, SOCIAL_KEYS, percentileMaps);
  const strategy = avgPercentileForGroups(name, STRATEGY_KEYS, percentileMaps);
  return (war + physical + social + strategy) / 4;
}

// Rates a player 1-10 off their raw percentile: 0-9 -> 1, 10-19 -> 2, ... 90-99/100 -> 10.
function ratingFromPercentile(pct) {
  const p = pct == null ? 50 : pct;
  return Math.min(10, Math.floor(p / 10) + 1);
}

// Comp-win weight: each full rating point of advantage makes a player 55/45 more likely
// to win a head-to-head than the rating below it (compounding — so bigger gaps swing
// harder). Feeding these weights into weightedPick/weightedPickN generalizes the same
// odds to multi-player comps (Luce's choice axiom). Roughly lands at:
//   10 vs 9  -> 55.0%   10 vs 6  -> 69.1%   10 vs 3 -> 80.3%
//   10 vs 8  -> 59.9%   10 vs 5  -> 73.2%   10 vs 2 -> 83.3%
//   10 vs 7  -> 64.6%   10 vs 4  -> 76.9%   10 vs 1 -> 85.9%
const COMP_RATING_SCALE = 55 / 45;
function compWeight(pct) {
  return Math.pow(COMP_RATING_SCALE, ratingFromPercentile(pct));
}

// Same 1-10 rating-tier system as comp-win, now at the same 55/45 ratio per rating
// point — used for every social/strategic/jury decision instead of a flat percentile
// weight, so they're randomized the same way as comps.
const SOCIAL_RATING_SCALE = 55 / 45;
function socialWeight(pct) {
  return Math.pow(SOCIAL_RATING_SCALE, ratingFromPercentile(pct));
}

// Adds a random nudge to a percentile before it's used for a weighted decision — keeps
// the underlying skill signal dominant, but stops the exact same favorites from getting
// targeted/voted/winning the exact same way run after run. Clamped to a valid percentile.
// Social/strategic decisions (nominations, votes, etc.) get a bigger nudge by default;
// comp wins pass a smaller amount so results stay closer to skill-driven.
function jitter(pct, amount = 28) {
  return Math.max(0, Math.min(100, pct + (Math.random() * 2 - 1) * amount));
}

// Weighted random pick — higher weight = more likely, but everyone always has SOME
// chance (weightFn should return > 0). Falls back to uniform-random if all weights are 0.
function weightedPick(candidates, weightFn) {
  const weights = candidates.map(weightFn);
  const total = weights.reduce((a, b) => a + b, 0);
  if (total <= 0) return candidates[Math.floor(Math.random() * candidates.length)];
  let r = Math.random() * total;
  for (let i = 0; i < candidates.length; i++) {
    r -= weights[i];
    if (r <= 0) return candidates[i];
  }
  return candidates[candidates.length - 1];
}

function weightedPickN(candidates, n, weightFn) {
  const pool = [...candidates];
  const picks = [];
  for (let i = 0; i < n && pool.length; i++) {
    const pick = weightedPick(pool, weightFn);
    picks.push(pick);
    pool.splice(pool.indexOf(pick), 1);
  }
  return picks;
}

// Simulates a full season week-by-week using the standard HoH -> Noms -> PoV -> Veto ->
// Replacement -> Vote -> Evict cycle, with percentiles steering every random decision.
// Comp wins (HoH/PoV/Final 3) run on the 55/45-per-rating-point curve; every social,
// strategic, and jury decision below runs on the same 55/45-per-rating-point curve
// (same 1-10 rating system, just a gentler ratio — see compWeight/socialWeight above):
//   - HoH comp win chance    <- HoH Rating percentile
//   - PoV comp win chance    <- PoV Rating percentile (only nominees + up to 3 others play,
//                                matching real Big Brother; the HoH never plays)
//   - Who gets nominated     <- weaker Overall Nominations percentile = bigger target
//   - Who PoV winner saves   <- stronger Overall Nominations percentile among the 2 nominees (protects an ally)
//   - Replacement nominee    <- same "weaker Overall Nominations = bigger target" logic
//   - Who gets voted out     <- weaker combined Overall Nominations + WAR percentile = more votes
//   - HoH tie-break vote     <- weighted toward whoever has the weaker combined Overall Nominations + WAR score
// All five of those social/strategic decisions get a small random nudge (±9 percentile
// points, see jitter()) before being weighted — keeps the skill signal in charge, but
// stops the same favorites from getting targeted/voted the exact same way every run.
// Endgame special cases:
//   - Final 4: if the PoV winner is NOT one of the 2 nominees (i.e. off the block), they
//     are barred from using the veto at all — noms stay locked, and the single remaining
//     non-nominee, non-HoH houseguest casts the sole eviction vote.
//   - Final 3: no nominations and no veto — the HoH simply chooses who to evict, weighted
//     toward evicting whichever of the other two poses the bigger competitive threat
//     (higher Overall Comp Ability percentile).
// At Final 2, a real jury vote decides the winner: the most recently evicted players (jury
// size set by cast size — 5 for 12/14, 9 for 24/36, 7 otherwise) each cast a vote weighted
// by each finalist's overall "best game" score (WAR + Physical + Social + Strategical,
// averaged equally) — not just Jury Management, which is only a minor piece buried
// inside the Strategical average.
const JURY_SIZE_BY_CAST_SIZE = { 12: 5, 14: 5, 16: 7, 18: 7, 20: 7, 21: 7, 24: 9, 36: 9 };

function simulateSeason(playerNames, percentileMaps) {
  let remaining = [...playerNames];
  const weeks = [];
  const hohWinners = new Set(); // tracks everyone who has ever won HoH this season
  let weekNum = 1;

  while (remaining.length > 3) {
    const isFinalFour = remaining.length === 4;
    // No one can win HoH twice in a season — except at Final 4, where past winners
    // are eligible again (everyone unconditionally competes by Final 3 anyway, so this
    // loosens the same way one round earlier).
    const hohEligible = isFinalFour ? remaining : remaining.filter((n) => !hohWinners.has(n));
    const hohPool = hohEligible.length ? hohEligible : remaining; // safety net if everyone left already won once
    const hoh = weightedPick(hohPool, (name) => compWeight(jitter(pctOrDefault(percentileMaps.hohPercentiles, name), 13)));
    hohWinners.add(hoh);
    const nonHoh = remaining.filter((n) => n !== hoh);

    const nominees = weightedPickN(nonHoh, Math.min(2, nonHoh.length), (name) => {
      const social = pctOrDefault(percentileMaps.overallNomPercentiles, name);
      return socialWeight(jitter(100 - social));
    });

    const povPool = nonHoh.filter((n) => !nominees.includes(n));
    const extraPovPlayers = weightedPickN(povPool, Math.min(3, povPool.length), () => 1); // uniform random draw, not skill-based
    const povPlayers = [...nominees, ...extraPovPlayers];
    const povWinner = weightedPick(povPlayers, (name) => compWeight(jitter(pctOrDefault(percentileMaps.povPercentiles, name), 13)));

    let vetoUsed = false, savedPlayer = null, repNominee = null;
    const winnerAlreadyNominated = nominees.includes(povWinner);
    if (winnerAlreadyNominated) {
      vetoUsed = true;
      savedPlayer = povWinner; // self-save
    } else if (isFinalFour) {
      vetoUsed = false; // Final 4 rule: off-the-block PoV winner cannot use the veto
    } else if (Math.random() < 0.6) {
      vetoUsed = true;
      savedPlayer = weightedPick(nominees, (name) => socialWeight(jitter(pctOrDefault(percentileMaps.overallNomPercentiles, name))));
    }

    let finalNominees = [...nominees];
    if (vetoUsed && savedPlayer) {
      finalNominees = finalNominees.filter((n) => n !== savedPlayer);
      const replacementPool = remaining.filter((n) =>
        n !== hoh && n !== savedPlayer && !finalNominees.includes(n) && !(!winnerAlreadyNominated && n === povWinner)
      );
      if (replacementPool.length > 0) {
        repNominee = weightedPick(replacementPool, (name) => {
          const social = pctOrDefault(percentileMaps.overallNomPercentiles, name);
          return socialWeight(jitter(100 - social));
        });
        finalNominees.push(repNominee);
      }
    }

    let votes = {}, voters = [], ballots = [], hohTieBreak = null, evicted;
    if (finalNominees.length < 2) {
      evicted = finalNominees[0];
    } else {
      voters = remaining.filter((n) => n !== hoh && !finalNominees.includes(n));
      finalNominees.forEach((n) => { votes[n] = 0; });
      voters.forEach((voter) => {
        const target = weightedPick(finalNominees, (name) => {
          const safety = (pctOrDefault(percentileMaps.overallNomPercentiles, name) + pctOrDefault(percentileMaps.skillPercentiles, name)) / 2;
          return socialWeight(jitter(100 - safety));
        });
        votes[target] += 1;
        ballots.push({ voter, target });
      });
      const maxVotes = Math.max(...Object.values(votes));
      const topTied = Object.keys(votes).filter((n) => votes[n] === maxVotes);
      if (topTied.length > 1) {
        hohTieBreak = weightedPick(topTied, (name) => {
          const safety = (pctOrDefault(percentileMaps.overallNomPercentiles, name) + pctOrDefault(percentileMaps.skillPercentiles, name)) / 2;
          return socialWeight(jitter(100 - safety));
        });
        evicted = hohTieBreak;
      } else {
        evicted = topTied[0];
      }
    }

    weeks.push({ stage: "normal", week: weekNum, hoh, nominees, povPlayers, povWinner, vetoUsed, savedPlayer, repNominee, finalNominees, votes, voters, ballots, hohTieBreak, evicted });
    remaining = remaining.filter((n) => n !== evicted);
    weekNum++;
  }

  // Final 3: no noms, no veto — HoH just picks who to evict, weighted toward the bigger
  // competitive threat (higher Overall Comp Ability percentile) between the other two.
  // Everyone remaining unconditionally competes here, so the no-repeat-HoH rule never applies.
  if (remaining.length === 3) {
    const hoh = weightedPick(remaining, (name) => compWeight(jitter(pctOrDefault(percentileMaps.hohPercentiles, name), 13)));
    hohWinners.add(hoh);
    const others = remaining.filter((n) => n !== hoh);
    const evicted = weightedPick(others, (name) => compWeight(jitter(pctOrDefault(percentileMaps.compPercentiles, name), 13)));
    weeks.push({ stage: "final3", week: weekNum, hoh, others, evicted });
    remaining = remaining.filter((n) => n !== evicted);
  }

  // Final 2: real jury vote — each juror is 50% merit-based (weighted by "best game"
  // score) and 50% a pure coinflip.
  let winner = null, runnerUp = null, jury = null;
  if (remaining.length === 2) {
    const [a, b] = remaining;
    const jurySize = JURY_SIZE_BY_CAST_SIZE[playerNames.length] || 7;
    const jurors = weeks.map((w) => w.evicted).slice(-jurySize);
    const juryVotes = { [a]: 0, [b]: 0 };
    const ballots = jurors.map((juror) => {
      // Each juror's vote is 50% merit-based (weighted by best-game score) and 50%
      // pure coinflip — half the jury effectively votes on the numbers, half on
      // factors the model can't capture (personal relationships, grudges, etc.).
      const vote = Math.random() < 0.5
        ? weightedPick([a, b], () => 1)
        : weightedPick([a, b], (name) => socialWeight(bestGameScore(name, percentileMaps)));
      juryVotes[vote] += 1;
      return { juror, vote };
    });
    winner = juryVotes[a] >= juryVotes[b] ? a : b;
    runnerUp = winner === a ? b : a;
    jury = { jurySize, ballots, juryVotes };
  } else if (remaining.length === 1) {
    winner = remaining[0];
  }

  // Finishing order, best placement first: Winner, Runner-Up, then everyone else in
  // reverse eviction order (most recently evicted finished higher).
  const placements = [winner, runnerUp, ...[...weeks].reverse().map((w) => w.evicted)].filter(Boolean);

  // Per-player season totals for the stats table — mirrors the same stat names used
  // elsewhere in the app (Comp Wins, HoH Wins, PoV Wins, Nominations, Replacement
  // Nominations, All Votes Against, All Votes For).
  const stats = {};
  playerNames.forEach((n) => {
    stats[n] = { hohWins: 0, povWins: 0, nominations: 0, repNominations: 0, votesAgainst: 0, votesFor: 0 };
  });
  weeks.forEach((w) => {
    if (w.stage === "final3") {
      stats[w.hoh].hohWins += 1;
      return;
    }
    stats[w.hoh].hohWins += 1;
    stats[w.povWinner].povWins += 1;
    w.nominees.forEach((n) => { stats[n].nominations += 1; });
    if (w.repNominee) stats[w.repNominee].nominations += 1;
    if (w.repNominee) stats[w.repNominee].repNominations += 1;
    (w.ballots || []).forEach(({ voter, target }) => {
      stats[voter].votesFor += 1;
      stats[target].votesAgainst += 1;
    });
  });
  const statRows = placements.map((n, i) => ({
    player: n, placement: i + 1, compWins: stats[n].hohWins + stats[n].povWins, ...stats[n],
  }));

  return { weeks, winner, runnerUp, jury, placements, statRows };
}

// Runs simulateSeason N times for the same cast and averages everything per player —
// Win % is literally "how many of the N simulated seasons did this player win", the
// closest thing to a probability estimate this model can produce.
function runMassSimulation(playerNames, percentileMaps, iterations) {
  const agg = {};
  playerNames.forEach((n) => {
    agg[n] = { wins: 0, placementSum: 0, compWinsSum: 0, hohWinsSum: 0, povWinsSum: 0, nomsSum: 0, repNomsSum: 0, votesAgainstSum: 0, votesForSum: 0 };
  });
  for (let i = 0; i < iterations; i++) {
    const result = simulateSeason(playerNames, percentileMaps);
    result.statRows.forEach((r) => {
      const a = agg[r.player];
      a.placementSum += r.placement;
      a.compWinsSum += r.compWins;
      a.hohWinsSum += r.hohWins;
      a.povWinsSum += r.povWins;
      a.nomsSum += r.nominations;
      a.repNomsSum += r.repNominations;
      a.votesAgainstSum += r.votesAgainst;
      a.votesForSum += r.votesFor;
    });
    if (result.winner) agg[result.winner].wins += 1;
  }
  return playerNames
    .map((n) => {
      const a = agg[n];
      return {
        player: n,
        wins: a.wins,
        winPct: (a.wins / iterations) * 100,
        avgPlacement: a.placementSum / iterations,
        avgCompWins: a.compWinsSum / iterations,
        avgHohWins: a.hohWinsSum / iterations,
        avgPovWins: a.povWinsSum / iterations,
        avgNoms: a.nomsSum / iterations,
        avgRepNoms: a.repNomsSum / iterations,
        avgVotesAgainst: a.votesAgainstSum / iterations,
        avgVotesFor: a.votesForSum / iterations,
      };
    })
    .sort((a, b) => b.winPct - a.winPct);
}

const CAST_SIZE_OPTIONS = [12, 14, 16, 18, 20, 21, 24, 36];
const OUTLIER_THRESHOLD = 35;

function median(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

// Flags cast members whose percentile for a stat is more than 35 points away from the
// cast's own average for that stat, in either direction — e.g. one strong competitor
// dropped into an otherwise weak-comp cast, or vice versa. Needs at least 3 data points
// to define a meaningful average.
function detectCastOutliers(players, map) {
  const entries = players
    .map((p) => ({ player: p, value: map && map.has(p.player) ? map.get(p.player) : null }))
    .filter((e) => e.value != null);
  if (entries.length < 3) return { outliers: [], center: null };
  const avg = entries.reduce((sum, e) => sum + e.value, 0) / entries.length;
  const outliers = entries
    .filter((e) => Math.abs(e.value - avg) > OUTLIER_THRESHOLD)
    .map((e) => ({ ...e, direction: e.value > avg ? "high" : "low" }))
    .sort((a, b) => Math.abs(b.value - avg) - Math.abs(a.value - avg));
  return { outliers, center: avg };
}

function OutlierFlagList({ title, result, contextLabel, centerLabel, onPlayerClick }) {
  if (!result.outliers.length) return null;
  return (
    <div className="outlier-block">

        <div key={o.player.player} className="outlier-row clickable-row" onClick={() => onPlayerClick(o.player.player)}>

      ))}
    </div>
  );
}

function CastAssessmentView({ allTime, percentileMaps, onPlayerClick }) {
  const [castSize, setCastSize] = useState(12);
  const [selected, setSelected] = useState([]);
  const [massSimResult, setMassSimResult] = useState(null);
  const [massSimRunning, setMassSimRunning] = useState(false);
  const players = selected.map((name) => allTime.find((p) => p.player === name)).filter(Boolean);

  function changeCastSize(size) {
    setCastSize(size);
    if (selected.length > size) setSelected((s) => s.slice(0, size));
    setMassSimResult(null);
  }

  function runMassSim() {
    setMassSimRunning(true);
    setMassSimResult(null);
    setTimeout(() => {
      setMassSimResult(runMassSimulation(selected, percentileMaps, 1000));
      setMassSimRunning(false);
    }, 30);
  }

  const castTotal = players.reduce((sum, p) => sum + p.totalScore, 0);
  const realDifficulties = SEASON_KEYS.map((sk) => {
    const roster = SEASONS[sk].totalStats;
    const scoreByPlayer = new Map(allTime.map((p) => [p.player, p.totalScore]));
    return roster.reduce((sum, row) => sum + (scoreByPlayer.get(row[0]) || 0), 0);
  });
  const harderThanCount = realDifficulties.filter((d) => d < castTotal).length;
  const difficultyPercentile = realDifficulties.length ? (harderThanCount / realDifficulties.length) * 100 : null;
  const rank = realDifficulties.filter((d) => d > castTotal).length + 1;

  const warOutliers = detectCastOutliers(players, percentileMaps.skillPercentiles);
  const compOutliers = detectCastOutliers(players, percentileMaps.compPercentiles);

  return (
    <div className="assessment-view">
      <div className="cast-size-row">
        <span className="cast-size-label">Cast Size:</span>
        {CAST_SIZE_OPTIONS.map((size) => (
          <button
            key={size}
            className={`view-tab sub-tab ${castSize === size ? "active" : ""}`}
            onClick={() => changeCastSize(size)}
          >
            {size}
          </button>
        ))}
      </div>

      <PlayerAddControl allTime={allTime} selected={selected} max={castSize} onAdd={(name) => { setSelected((s) => [...s, name]); setMassSimResult(null); }} />

      <div className="cast-slot-grid">
        {Array.from({ length: castSize }).map((_, i) => (
          <CastSlot
            key={i}
            index={i}
            player={players[i] || null}
            onRemove={(n) => { setSelected((s) => s.filter((x) => x !== n)); setMassSimResult(null); }}
            onClickPlayer={onPlayerClick}
          />
        ))}
      </div>

      {players.length === 0 ? (
        <div className="empty-era">Add players to fill out this hypothetical cast.</div>
      ) : (
        <>
          <div className="home-winner-grid" style={{ gridTemplateColumns: "1fr 1fr" }}>
            <div className="home-winner-card">
              <div className="home-winner-title">Cast Difficulty</div>
              <div className="home-winner-rating" style={{ fontSize: 20 }}>{Math.round(castTotal)}</div>
              <div className="home-winner-sub">Sum of every selected player's all-time Skill Rating</div>
            </div>
            <div className="home-winner-card">
              <div className="home-winner-title">Vs. Real Seasons</div>
              <div className="home-winner-rating" style={{ fontSize: 20 }}>
                {difficultyPercentile != null ? `${difficultyPercentile.toFixed(1)}%` : "—"}
              </div>
              <div className="home-winner-sub">
                Would rank #{rank} of {SEASON_KEYS.length + 1} — harder than {difficultyPercentile != null ? difficultyPercentile.toFixed(1) : "—"}% of real seasons
              </div>
            </div>
          </div>

          <OutlierFlagList title="WAR" result={warOutliers} contextLabel="cast" centerLabel="average" onPlayerClick={onPlayerClick} />
          <OutlierFlagList title="Overall Comp Ability" result={compOutliers} contextLabel="cast" centerLabel="average" onPlayerClick={onPlayerClick} />

          <div className="section-sublabel">Cast Average Percentiles</div>
          <div className="cmp-table" style={{ gridTemplateColumns: "180px 1fr" }}>
            {ASSESSMENT_METRIC_GROUPS.map((group) => (
              <React.Fragment key={group.header || "top"}>
                {group.header && <div className="cmp-group-header" style={{ gridColumn: "1 / span 2" }}>{group.header}</div>}
                {group.metrics.map((m) => {
                  const map = percentileMaps[m.mapKey];
                  const known = players.map((p) => (map && map.has(p.player) ? map.get(p.player) : null)).filter((v) => v != null);
                  const avg = known.length ? known.reduce((a, b) => a + b, 0) / known.length : null;
                  return (
                    <React.Fragment key={m.label}>
                      <div className="cmp-row-label">{m.label}</div>
                      <div className="cmp-cell">{avg == null ? "—" : avg.toFixed(1)}</div>
                    </React.Fragment>
                  );
                })}
              </React.Fragment>
            ))}
          </div>

          <div className="section-sublabel">Mass Simulation</div>
          <button
            className="player-add-btn sim-run-btn"
            disabled={selected.length < castSize || massSimRunning}
            onClick={runMassSim}
          >
            {massSimRunning ? "Running 1000 simulations..." : massSimResult ? "Re-run Mass Simulation" : "Run Mass Simulation"}
          </button>
          {selected.length < castSize && <div className="sim-hint">Fill all {castSize} slots to run the mass simulation.</div>}

          {massSimResult && (
            <>
              <div className="mass-sim-note">Sims 1000 seasons to show probability odds that they will win.</div>
              <DataTable
                columns={[
                  "Player", "Win %", "Wins (of 1000)", "Avg Placement", "Avg Comp Wins", "Avg HoH Wins",
                  "Avg PoV Wins", "Avg Nominations", "Avg Replacement Nominations", "Avg Votes Against", "Avg Votes For",
                ]}
                rows={massSimResult.map((r) => [
                  r.player, r.winPct.toFixed(1), r.wins, r.avgPlacement.toFixed(2), r.avgCompWins.toFixed(2),
                  r.avgHohWins.toFixed(2), r.avgPovWins.toFixed(2), r.avgNoms.toFixed(2), r.avgRepNoms.toFixed(2),
                  r.avgVotesAgainst.toFixed(2), r.avgVotesFor.toFixed(2),
                ])}
                sortable
                filterable
                defaultSortIdx={1}
                onPlayerClick={onPlayerClick}
              />
            </>
          )}
        </>
      )}
    </div>
  );
}

function displayName(n) {
  return n.replace(/\s+S\d+.*$/, "");
}

// Builds this player's cell for a given week: what happened to them that week.
function cellContentFor(player, w) {
  if (w.stage === "final3") {
    if (player === w.hoh) return { text: "HoH", cls: "cell-hoh" };
    if (player === w.evicted) return { text: "Evicted", cls: "cell-evicted" };
    if (w.others.includes(player)) return { text: "Safe", cls: "" };
    return null;
  }
  if (player === w.hoh) return { text: "HoH", cls: "cell-hoh" };
  if (player === w.povWinner) {
    if (!w.vetoUsed) return { text: "Discarded", cls: "cell-veto" };
    if (w.savedPlayer === player) return { text: "Vetoed Self", cls: "cell-veto" };
    return { text: `Vetoed ${displayName(w.savedPlayer)}`, cls: "cell-veto" };
  }
  if (player === w.savedPlayer) return { text: "Saved", cls: "cell-veto" };
  if (w.repNominee === player) {
    return player === w.evicted
      ? { text: "Evicted (Rep)", cls: "cell-evicted" }
      : { text: "Nominated (Rep)", cls: "cell-nominated" };
  }
  if (w.nominees.includes(player)) {
    return player === w.evicted
      ? { text: "Evicted", cls: "cell-evicted" }
      : { text: "Nominated", cls: "cell-nominated" };
  }
  const ballot = (w.ballots || []).find((b) => b.voter === player);
  if (ballot) return { text: displayName(ballot.target), cls: "cell-vote" };
  return null;
}

function SeasonChart({ result, onPlayerClick }) {

      <table className="season-chart">
        <thead>
          <tr>
            <th className="chart-name-th">Player</th>
            {weeks.map((w) => (
              <th key={w.week}>{w.stage === "final3" ? "Final 3" : `Week ${w.week}`}</th>
            ))}
            <th>Result</th>
          </tr>
        </thead>
        <tbody>
          {placements.map((player, i) => (
            <tr key={player}>
              <td className="chart-name-cell clickable-row" onClick={() => onPlayerClick(player)}>
                <span className="chart-place">#{i + 1}</span> {player}
              </td>
              {weeks.map((w) => {
                const evictedWeek = evictedAtWeek[player];
                if (evictedWeek != null && evictedWeek < w.week) {
                  return <td key={w.week} className="cell-gone">—</td>;
                }
                const cell = cellContentFor(player, w);
                return (
                  <td key={w.week} className={cell ? cell.cls : ""}>
                    {cell ? cell.text : ""}
                  </td>
                );
              })}
              <td className={player === result.winner ? "cell-winner" : player === result.runnerUp ? "cell-runnerup" : ""}>
                {player === result.winner ? "Winner" : player === result.runnerUp ? "Runner-Up" : ""}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function SimInfoButton() {

      <p>Every HoH and PoV competition, plus the Final 3 eviction, is decided by <strong>Overall Comp Ability</strong> (HoH Rating / PoV Rating for those specific comps) — each full 1-10 rating point of advantage makes a player 55/45 more likely to win, compounding for bigger gaps.</p>

// Explains every percentile category shown on player cards and in Player Percentiles.

      <p><strong>Quality of Competition</strong> — How difficult the opponents they've faced have been.</p>
      <p><strong>Overall Comp Ability</strong> — Combines HoH and PoV win totals into one overall measure of how physically/mentally dominant they are in competitions.</p>
      <p><strong>HoH Rating</strong> — How dominant they are specifically in Head of Household competitions.</p>
      <p><strong>PoV Rating</strong> — How dominant they are specifically in Power of Veto competitions.</p>
      <p><strong>Overall Nominations</strong> — A broad measure of how well they avoid, survive, and manage being put on the block.</p>
      <p><strong>Times Nominated</strong> — How often they stay off the block relative to how much they played.</p>
      <p><strong>Replacement Nominated</strong> — How often they become the replacement nominee after a veto — a sign of how often they're backdoored.</p>
      <p><strong>Saved with PoV</strong> — How good they are at getting the veto used on themselves, whether they win it and save themselves or someone else does it for them.</p>
      <p><strong>Votes to Save</strong> — How many votes they earn to stay in the house — how well-liked or well-positioned they are during eviction votes.</p>
      <p><strong>Votes Survived</strong> — How often they survive an eviction vote due to strong positioning and likability, separate from being saved by the veto.</p>

}

// Season-by-season WAR trend: this player's Skill Rating each season, shown as a
// percentile against every single game ever played (all of Per Game Breakdown).
// Simple hand-rolled SVG line chart — no external charting library, so this works as a
// single self-contained HTML file loaded straight from disk (recharts requires a real
// module bundler/server to load reliably; this doesn't).
function SvgLineChart({ series, height = 220 }) {
  const width = 640;
  const padL = 34, padR = 16, padT = 20, padB = 28;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const labels = series[0] ? series[0].points.map((p) => p.label) : [];
  const n = labels.length;
  const xFor = (i) => padL + (n > 1 ? (i / (n - 1)) * plotW : plotW / 2);
  const yFor = (v) => padT + plotH - (Math.max(0, Math.min(100, v)) / 100) * plotH;
  const [hover, setHover] = useState(null);

  return (
    <div className="war-trend-chart">
      <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} style={{ display: "block" }}>
        {[0, 25, 50, 75, 100].map((g) => (
          <g key={g}>
            <line x1={padL} x2={width - padR} y1={yFor(g)} y2={yFor(g)} stroke="#262C3A" strokeDasharray="3 3" />
            <text x={padL - 8} y={yFor(g) + 4} fontSize="11" fill="#8A93A6" textAnchor="end">{g}</text>
          </g>
        ))}
        {labels.map((lab, i) => (
          <text key={i} x={xFor(i)} y={height - 8} fontSize="11" fill="#8A93A6" textAnchor="middle">{lab}</text>
        ))}
        {series.map((s) => {
          const pts = s.points.filter((p) => p.value != null);
          const path = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xFor(s.points.indexOf(p))} ${yFor(p.value)}`).join(" ");
          return (
            <g key={s.name}>
              <path d={path} fill="none" stroke={s.color} strokeWidth="2" />
              {s.points.map((p, i) => p.value == null ? null : (
                <circle
                  key={i} cx={xFor(i)} cy={yFor(p.value)} r={hover && hover.si === s.name && hover.i === i ? 6 : 4}
                  fill={s.color} style={{ cursor: "pointer" }}
                  onMouseEnter={() => setHover({ si: s.name, i })}
                  onMouseLeave={() => setHover(null)}
                />
              ))}
            </g>
          );
        })}
      </svg>
      {hover && (() => {
        const s = series.find((s) => s.name === hover.si);
        const p = s.points[hover.i];
        return <div className="svg-chart-tooltip">{p.label} — {s.name}: {p.value == null ? "N/A" : `${p.value}%`}</div>;
      })()}
      {series.length > 1 && (
        <div className="svg-chart-legend">
          {series.map((s) => <span key={s.name}><i style={{ background: s.color }} />{s.name}</span>)}
        </div>
      )}
    </div>
  );
}

function WarTrendChart({ rows, gamePercentileFn }) {
  const points = rows.map((r) => ({ label: `S${r[1]}`, value: gamePercentileFn(r[2]) }));
  if (points.every((p) => p.value == null)) return null;
  return <SvgLineChart series={[{ name: "WAR percentile", color: "#FFD60A", points }]} />;
}

// Same idea as the WAR trend chart, but two lines: this player's per-SEASON (not
// all-time) Comp Ability and Overall Nominations scores, each shown as a percentile
// against every single game ever played.
function CompNomTrendChart({ rows, compPercentileFn, nomPercentileFn }) {
  const compPoints = rows.map((r) => ({ label: `S${r[1]}`, value: compPercentileFn(r) }));
  const nomPoints = rows.map((r) => ({ label: `S${r[1]}`, value: nomPercentileFn(r) }));
  if (compPoints.every((p) => p.value == null) && nomPoints.every((p) => p.value == null)) return null;
  return (
    <SvgLineChart series={[
      { name: "Comps", color: "#FFD60A", points: compPoints },
      { name: "Nominations", color: "#FF6B6B", points: nomPoints },
    ]} />
  );
}

// Season Ratings: like Cast Assessment, but automatic — takes this season's actual
// Season Ratings: like Cast Assessment, but automatic — takes this season's actual
// roster (no picking) and shows the group-average percentile per metric.
function SeasonRatings({ season, allTimeByName, percentileMaps, onPlayerClick }) {
  const playerNames = season.totalStats.map((row) => row[0]);
  const players = playerNames.map((n) => allTimeByName.get(n)).filter(Boolean);

  return (
    <div className="assessment-view season-ratings">
      <div className="section-header">SEASON RATINGS</div>

      <div className="section-sublabel">Season Average Percentiles</div>
      <div className="cmp-table" style={{ gridTemplateColumns: "180px 1fr" }}>
        {ASSESSMENT_METRIC_GROUPS.map((group) => (
          <React.Fragment key={group.header || "top"}>
            {group.header && <div className="cmp-group-header" style={{ gridColumn: "1 / span 2" }}>{group.header}</div>}
            {group.metrics.map((m) => {
              const map = percentileMaps[m.mapKey];
              const known = players.map((p) => (map && map.has(p.player) ? map.get(p.player) : null)).filter((v) => v != null);
              const avg = known.length ? known.reduce((a, b) => a + b, 0) / known.length : null;
              return (
                <React.Fragment key={m.label}>
                  <div className="cmp-row-label">{m.label}</div>
                  <div className="cmp-cell">{avg == null ? "—" : avg.toFixed(1)}</div>
                </React.Fragment>
              );
            })}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

  const [eraTabIdx, setEraTabIdx] = useState(ERAS.indexOf(eraForSeason(SEASON_KEYS[0])));
  const [selectedPlayer, setSelectedPlayer] = useState(null); // base name string or null

  const seasonsInEra = SEASON_KEYS.filter((sk) => sk >= ERAS[eraIdx].start && sk <= ERAS[eraIdx].end);
  const seasonsInEraTab = SEASON_KEYS.filter((sk) => sk >= ERAS[eraTabIdx].start && sk <= ERAS[eraTabIdx].end);
  const seasonsCumulativeToEra = SEASON_KEYS.filter((sk) => sk <= ERAS[eraTabIdx].end);

  function handleEraChange(newIdx) {
    setEraIdx(newIdx);
    const seasonsHere = SEASON_KEYS.filter((sk) => sk >= ERAS[newIdx].start && sk <= ERAS[newIdx].end);
    if (seasonsHere.length && !seasonsHere.includes(seasonKey)) setSeasonKey(seasonsHere[0]);
  }

    setSeasonKey(newSeasonKey);
    setEraIdx(ERAS.indexOf(eraForSeason(newSeasonKey)));

  function handlePlayerClick(playerField) {
    setSelectedPlayer(playerField);
  }

  // Every place that switches views (nav buttons, or a click-through from Home/Season
  // Difficulty) goes through this so the active category always stays in sync with tab.
  function goToTab(newTab) {
    setTab(newTab);
    setCategory(CATEGORY_BY_TAB[newTab] || category);

  function handleSeasonDifficultyClick(seasonNum) {

      {tab === "home" && (
        <HomeView
          allTime={allTime}
          compPercentiles={compPercentiles}
          skillPercentiles={skillPercentiles}
          onPlayerClick={handlePlayerClick}
          onSeasonClick={handleSeasonDifficultyClick}
        />
      )}

      {tab === "season" && (
        <>
          <div className="season-picker">
            <select className="season-select era-select" value={eraIdx} onChange={(e) => handleEraChange(Number(e.target.value))}>
              {ERAS.map((e, idx) => (
                <option key={e.name} value={idx}>{e.name} ({e.start}-{e.end})</option>
              ))}
            </select>
            {seasonsInEra.length > 0 && (
              <select className="season-select" value={seasonKey} onChange={(e) => handleSeasonChange(Number(e.target.value))}>
                {seasonsInEra.map((k) => <option key={k} value={k}>{SEASONS[k].label}</option>)}
              </select>
            )}
          </div>
          {seasonsInEra.length > 0 ? (
            <SeasonView
              season={SEASONS[seasonKey]}
              seasonKey={seasonKey}
              allTimeByName={allTimeByName}
              percentileMaps={cardPercentileMaps}
              onPlayerClick={handlePlayerClick}
            />
          ) : (
            <div className="empty-era">No seasons entered yet for {ERAS[eraIdx].name} ({ERAS[eraIdx].start}-{ERAS[eraIdx].end}).</div>
          )}
        </>
      )}

      {tab === "alltime" && (
        <DataTable columns={AT_COLS} rows={allTimeRows} highlightWinnerCol sortable filterable defaultSortIdx={2} onPlayerClick={handlePlayerClick} />
      )}

      {tab === "pergame" && (
        <DataTable columns={TOTAL_STATS_COLS} rows={perGameDisplay} highlightWinnerCol highlightColIdx={22} sortable filterable defaultSortIdx={2} onPlayerClick={handlePlayerClick} />
      )}

      {tab === "eraAllTime" && (
        <>
          <div className="season-picker">
            <select className="season-select era-select" value={eraTabIdx} onChange={(e) => setEraTabIdx(Number(e.target.value))}>
              {ERAS.map((e, idx) => (
                <option key={e.name} value={idx}>{e.name} (1-{e.end})</option>
              ))}
            </select>
          </div>
          {seasonsCumulativeToEra.length > 0 ? (
            <DataTable columns={AT_COLS} rows={eraAllTimeRows} highlightWinnerCol sortable filterable defaultSortIdx={2} onPlayerClick={handlePlayerClick} />
          ) : (
            <div className="empty-era">No seasons entered yet for {ERAS[eraTabIdx].name} (1-{ERAS[eraTabIdx].end}).</div>
          )}
        </>
      )}

      {tab === "eraPerGame" && (
        <>
          <div className="season-picker">
            <select className="season-select era-select" value={eraTabIdx} onChange={(e) => setEraTabIdx(Number(e.target.value))}>
              {ERAS.map((e, idx) => (
                <option key={e.name} value={idx}>{e.name} ({e.start}-{e.end})</option>
              ))}
            </select>
          </div>
          {seasonsInEraTab.length > 0 ? (
            <DataTable columns={ERA_PER_ERA_COLS} rows={eraPerEraRowsWithWinner} highlightWinnerCol highlightColIdx={WINS_COL_IDX} sortable filterable defaultSortIdx={2} onPlayerClick={handlePlayerClick} />
          ) : (
            <div className="empty-era">No seasons entered yet for {ERAS[eraTabIdx].name} ({ERAS[eraTabIdx].start}-{ERAS[eraTabIdx].end}).</div>
          )}
        </>
      )}

      {tab === "seasonDifficulty" && (
        <DataTable
          columns={SEASON_DIFFICULTY_COLS}
          rows={seasonDifficultyRows}
          sortable
          filterable
          defaultSortIdx={3}
          onPlayerClick={handleSeasonDifficultyClick}
          imageLookup={(row) => SEASON_ART[row[0]]}
          imageColumn
        />
      )}

      {tab === "percentiles" && (
        <PlayerPercentilesView allTime={allTime} percentileMaps={cardPercentileMaps} onPlayerClick={handlePlayerClick} />
      )}

      {tab === "compare" && (
        <ComparePlayersView allTime={allTime} percentileMaps={percentileMaps} onPlayerClick={handlePlayerClick} />
      )}

      {tab === "cast" && (
        <CastAssessmentView allTime={allTime} percentileMaps={percentileMaps} onPlayerClick={handlePlayerClick} />
      )}

      {tab === "simulation" && (
        <SimulationView allTime={allTime} percentileMaps={percentileMaps} onPlayerClick={handlePlayerClick} />
      )}

      {tab === "massSim" && (
        <MassSimulationView allTime={allTime} percentileMaps={percentileMaps} onPlayerClick={handlePlayerClick} />
      )}

      {selectedPlayer && (
        <PlayerHistoryModal
          baseName={selectedPlayer}
          rows={selectedPlayerRows}
          skillPercentiles={cardSkillPercentiles}
          compPercentiles={cardCompPercentiles}
          hohPercentiles={cardHohPercentiles}
          povPercentiles={cardPovPercentiles}
          qualityOfCompPercentiles={cardQualityOfCompPercentiles}
          overallNomPercentiles={cardOverallNomPercentiles}
          timesNominatedPercentiles={cardTimesNominatedPercentiles}
          repNominatedPercentiles={cardRepNominatedPercentiles}
          savedWithPovPercentiles={cardSavedWithPovPercentiles}
          votesToSavePercentiles={cardVotesToSavePercentiles}
          votesSurvivedPercentiles={cardVotesSurvivedPercentiles}
          survivedBackdoorPercentiles={cardSurvivedBackdoorPercentiles}
          votesToEvictPercentiles={cardVotesToEvictPercentiles}
          juryManagementPercentiles={cardJuryManagementPercentiles}
          gamePercentileFn={gamePercentileFn}
          compGamePercentileFn={compGamePercentileFn}
          nomGamePercentileFn={nomGamePercentileFn}
          onClose={() => setSelectedPlayer(null)}
        />
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<BBDataReview />);

</script>
</body>
</html>
